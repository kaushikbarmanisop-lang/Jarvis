<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS UI</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f2027, #000000);
      font-family: 'Segoe UI', sans-serif;
      color: #00f7ff;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    .circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #00f7ff;
      box-shadow: 0 0 20px #00f7ff, 0 0 60px #00f7ff inset;
      margin: 0 auto 30px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 20px #00f7ff; }
      50% { transform: scale(1.1); box-shadow: 0 0 40px #00f7ff; }
      100% { transform: scale(1); box-shadow: 0 0 20px #00f7ff; }
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .typing {
      font-size: 1.2rem;
      border-right: 2px solid #00f7ff;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .download-btn {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 16px;
      background: #00f7ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: black;
      box-shadow: 0 0 15px #00f7ff;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: #00c3cc;
      box-shadow: 0 0 25px #00f7ff;
      transform: scale(1.05);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="circle"></div>
  <h1>JARVIS SYSTEM</h1>
  <div class="typing" id="text"></div>
  <br>
  <button onclick="downloadApp()" class="download-btn">Download JARVIS</button>
</div>

<div class="footer">Made By Kaushik & ChatGPT</div>

<script>
  const message = "Initializing AI Interface...";
  let index = 0;

  function typeEffect() {
    if (index < message.length) {
      document.getElementById("text").innerHTML += message.charAt(index);
      index++;
      setTimeout(typeEffect, 80);
    }
  }

  function downloadApp() {
    const link = document.createElement('a');
    // 👉 Replace this with your real EXE download link
    link.href = 'https://github.com/kaushikbarmanisop-lang/Jarvis/releases/tag/Jarvis';
    link.download = 'jarvis.exe';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  typeEffect();
</script>

</body>
</html>
